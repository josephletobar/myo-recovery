# Stateful pose-module override for the current Meta EMG2Pose code.
#
# Copy to the Meta repository as
# config/pose_module/actionsense_30hz.yaml and select it with
# `pose_module=actionsense_30hz`.
#
# The upstream module computes `seconds` using its hard-coded
# EMG_SAMPLE_RATE=2000. With stride-1 TDS features at 30 Hz, setting
# rollout_freq=2000 makes its computed rollout length equal the number of
# input feature rows, so there is no additional temporal resampling. If you
# parameterize that upstream constant instead, use input_sample_rate=30 and
# rollout_freq=30; the resulting behavior is equivalent and clearer.

_target_: emg2pose.pose_modules.StatePoseModule
predict_vel: false
state_condition: true
rollout_freq: 2000
network: ${network}
