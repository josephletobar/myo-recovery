# Stateful pose-module override for the current Meta EMG2Pose code.
#
# Copy to the Meta repository as
# config/pose_module/actionsense_30hz.yaml and select it with
# `pose_module=actionsense_30hz`.
#
# The upstream module is patched to use the actual input rate explicitly.
# This keeps decoder timing and derivative metrics in 30 Hz units.

_target_: emg2pose.pose_modules.StatePoseModule
predict_vel: false
state_condition: true
input_sample_rate: 30
rollout_freq: 30
network: ${network}
