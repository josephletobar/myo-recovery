# TDS network fragment for the ActionSense export.
#
# Meta's original TDS configuration uses strides [5, 2, 4, 2] to turn
# 2,000-Hz EMG into approximately 25-Hz features. ActionSense is exported at
# 30 Hz already, so every temporal stride must remain 1.
# With the original kernel widths this leaves roughly 63 input samples of
# receptive field (about 2.1 seconds at 30 Hz), rather than 1,791 samples at
# 2 kHz. If you later want a shorter context, reduce the kernel widths or the
# number of TDS blocks deliberately; do not reintroduce hidden strides.
#
# Copy this file to the Meta emg2pose repository as
# config/network/tds_actionsense.yaml and select it with:
#   experiment=regression_actionsense transforms=basic
# Pair it with `pose_module=actionsense_30hz` and
# `datamodule=actionsense_30hz` from the companion fragments in this repo.

_target_: emg2pose.networks.TdsNetwork

conv_blocks:
  - _target_: emg2pose.networks.Conv1dBlock
    in_channels: 8
    out_channels: 256
    kernel_size: 11
    stride: 1
  - _target_: emg2pose.networks.Conv1dBlock
    in_channels: 256
    out_channels: 256
    kernel_size: 5
    stride: 1

tds_stages:
  - _target_: emg2pose.networks.TdsStage
    in_channels: 256
    in_conv_kernel_width: 17
    in_conv_stride: 1
    num_blocks: 2
    channels: 16
    feature_width: 16
    kernel_width: 9
  - _target_: emg2pose.networks.TdsStage
    in_channels: 256
    in_conv_kernel_width: 9
    in_conv_stride: 1
    num_blocks: 2
    channels: 16
    feature_width: 16
    kernel_width: 5
    out_channels: 64
